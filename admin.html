<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP Admin - Generador de Recordatorio</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      gap: 16px;
    }
    h1 { color: #c8960c; font-size: 26px; font-weight: 400; }
    #total-pedido { font-size: 20px; color: #fff; margin-bottom: 10px; }
    canvas { display: none; }
    #preview {
      max-width: 90vw;
      max-height: 75vh;
      border: 1px solid #c8960c;
      border-radius: 8px;
    }
    #btn-descargar {
      background: linear-gradient(135deg, #c8960c, #f5d060, #b8860b);
      color: #000;
      font-weight: bold;
      font-size: 18px;
      padding: 12px 32px;
      border-radius: 8px;
      text-decoration: none;
      display: none;
    }
    #sin-pedido { font-size: 18px; color: #aaa; text-align: center; display: none; }
  </style>
</head>
<body>

  <h1>KP Admin</h1>
  <div id="total-pedido"></div>
  <a id="btn-descargar" download="recordatorio_kp.jpg">⬇️ Descargar imagen</a>
  <img id="preview" style="display:none;">
  <canvas id="canvas"></canvas>
  <div id="sin-pedido">No hay pedidos registrados. Espera una compra.</div>

  <script>
    function obtenerFechaFinMes() {
      const hoy = new Date();
      const ultimoDia = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0).getDate();
      const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
      return `${ultimoDia} De ${meses[hoy.getMonth()]}`;
    }

    // MODIFICADA: Ahora esta función no dibuja nada para no duplicar títulos.
    function drawMixedText(ctx, text, x, y, size) {
      // Función vacía intencionalmente. Los títulos están en la imagen de fondo.
      // Puedes borrar esta función si prefieres limpiar el código.
    }

    // NUEVA: Función para dibujar solo los valores (Total y Fecha) en blanco.
    function drawValueText(ctx, text, x, y, size) {
      ctx.save();
      ctx.textAlign = "center";
      ctx.fillStyle = "#ffffff";
      
      const chars = text.split('');
      const widths = chars.map(ch => {
        const isNum = /[0-9]/.test(ch);
        ctx.font = `400 ${size}px ${isNum ? 'Arial' : "'Playfair Display', serif"}`;
        return ctx.measureText(ch).width;
      });
      
      let totalWidth = widths.reduce((a, b) => a + b, 0);
      let curX = x - totalWidth / 2;

      chars.forEach((ch, i) => {
        const isNum = /[0-9]/.test(ch);
        ctx.font = `400 ${size}px ${isNum ? 'Arial' : "'Playfair Display', serif"}`;
        ctx.fillText(ch, curX + widths[i] / 2, y);
        curX += widths[i];
      });
      ctx.restore();
    }

    const total = localStorage.getItem("kp_ultimo_total");

    if (!total) {
      document.getElementById("sin-pedido").style.display = "block";
    } else {
      const precioTexto = "$" + parseInt(total).toLocaleString('es-CO');
      const fecha = obtenerFechaFinMes();
      document.getElementById("total-pedido").textContent = "Total: " + precioTexto;
      document.fonts.ready.then(() => cargarImagenes(precioTexto, fecha));
    }

    function cargarImagenes(precioTexto, fecha) {
      const fondo = new Image();
      const qr = new Image();
      fondo.crossOrigin = "anonymous";
      qr.crossOrigin = "anonymous";

      // Tus archivos en GitHub
      fondo.src = "https://kaleth77.github.io/kpreloj/img/recordatorio.JPEG";
      qr.src = "https://kaleth77.github.io/kpreloj/img/qr-llave.jpg";

      fondo.onload = () => {
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = fondo.width;
        canvas.height = fondo.height;

        ctx.drawImage(fondo, 0, 0);

        // --- UBICACIÓN DE VALORES (Solo rrellenar huecos) ---
        
        // 1. Dibujar el Total ($125.000) en el hueco superior.
        // Ajusté la coordenada y a 310 para que encaje bajo "Cantidad a pagar".
        drawValueText(ctx, precioTexto, canvas.width/2, 310, 110);

        // --- UBICACIÓN DEL QR Y LLAVE ---
        qr.onload = () => {
          // 2. Dibujar el QR y llave centrado en la parte inferior.
          const qrW = 750; // Ancho del QR
          const qrH = (qr.height * qrW) / qr.width;
          const qrX = (canvas.width - qrW)/2; // Centrado horizontal
          
          // Ajusté la coordenada y a 450 para que quede en el medio.
          ctx.drawImage(qr, qrX, 450, qrW, qrH);

          // 3. Dibujar la Fecha (30 De Abril) en el hueco inferior.
          // Ajusté la coordenada y a 1050 para que encaje bajo "Fecha límite".
          const fechaY = 450 + qrH + 80;
          drawValueText(ctx, fecha, canvas.width/2, fechaY, 95);

          const dataUrl = canvas.toDataURL("image/jpeg", 0.95);
          const preview = document.getElementById("preview");
          preview.src = dataUrl;
          preview.style.display = "block";
          
          const btn = document.getElementById("btn-descargar");
          btn.href = dataUrl;
          btn.style.display = "block";
        };
      };
    }
  </script>
</body>
</html>
