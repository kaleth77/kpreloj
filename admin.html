<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP Admin - Generador de Recordatorio</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      gap: 16px;
    }
    h1 { color: #c8960c; font-size: 26px; font-weight: 400; }
    #total-pedido { font-size: 20px; color: #fff; margin-bottom: 10px; }
    canvas { display: none; }
    #preview {
      max-width: 90vw;
      max-height: 75vh;
      border: 1px solid #c8960c;
      border-radius: 8px;
    }
    #btn-descargar {
      background: linear-gradient(135deg, #c8960c, #f5d060, #b8860b);
      color: #000;
      font-weight: bold;
      font-size: 18px;
      padding: 12px 32px;
      border-radius: 8px;
      text-decoration: none;
      display: none;
    }
    #sin-pedido { font-size: 18px; color: #aaa; text-align: center; display: none; }
  </style>
</head>
<body>

  <h1>KP Admin</h1>
  <div id="total-pedido"></div>
  <a id="btn-descargar" download="recordatorio_kp.jpg">⬇️ Descargar imagen</a>
  <img id="preview" style="display:none;">
  <canvas id="canvas"></canvas>
  <div id="sin-pedido">No hay pedidos registrados. Espera una compra.</div>

  <script>
    function obtenerFechaFinMes() {
      const hoy = new Date();
      const ultimoDia = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0).getDate();
      const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
      return `${ultimoDia} De ${meses[hoy.getMonth()]}`;
    }

    function drawMixedText(ctx, text, x, y, size) {
      ctx.save();
      ctx.textAlign = "center";
      ctx.fillStyle = "#ffffff";
      
      const chars = text.split('');
      const widths = chars.map(ch => {
        const isNum = /[0-9]/.test(ch);
        ctx.font = `400 ${size}px ${isNum ? 'Arial' : "'Playfair Display', serif"}`;
        return ctx.measureText(ch).width;
      });
      
      let totalWidth = widths.reduce((a, b) => a + b, 0);
      let curX = x - totalWidth / 2;

      chars.forEach((ch, i) => {
        const isNum = /[0-9]/.test(ch);
        ctx.font = `400 ${size}px ${isNum ? 'Arial' : "'Playfair Display', serif"}`;
        ctx.fillText(ch, curX + widths[i] / 2, y);
        curX += widths[i];
      });
      ctx.restore();
    }

    const total = localStorage.getItem("kp_ultimo_total");

    if (!total) {
      document.getElementById("sin-pedido").style.display = "block";
    } else {
      const precioTexto = "$" + parseInt(total).toLocaleString('es-CO');
      const fecha = obtenerFechaFinMes();
      document.getElementById("total-pedido").textContent = "Total: " + precioTexto;
      document.fonts.ready.then(() => cargarImagenes(precioTexto, fecha));
    }

    function cargarImagenes(precioTexto, fecha) {
      const fondo = new Image();
      const qr = new Image();
      fondo.crossOrigin = "anonymous";
      qr.crossOrigin = "anonymous";

      fondo.src = "https://kaleth77.github.io/kpreloj/img/recordatorio.JPEG";
      qr.src = "https://kaleth77.github.io/kpreloj/img/qr-llave.jpg";

      fondo.onload = () => {
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = fondo.width;
        canvas.height = fondo.height;

        ctx.drawImage(fondo, 0, 0);

        // --- UBICACIÓN DE TEXTOS LIMPIOS ---
        // 1. Monto Grande Arriba (centrado)
        drawMixedText(ctx, precioTexto, canvas.width/2, 175, 120);

        // --- UBICACIÓN DEL QR ---
        qr.onload = () => {
          // 2. QR en el Medio (centrado)
          const qrW = 700; // Ancho del QR
          const qrH = (qr.height * qrW) / qr.width;
          const qrY = (canvas.width - qrW)/2; // Centrado horizontal
          ctx.drawImage(qr, qrY, 250, qrW, qrH);

          // 3. Fecha Abajo (debajo del QR, centrado)
          drawMixedText(ctx, "Fecha límite de pago:", canvas.width/2, 980, 80);
          drawMixedText(ctx, fecha, canvas.width/2, 1080, 95);

          // 4. La Llave al Final (caja resaltada, centrada)
          const llaveY = 1200;
          ctx.font = "400 65px 'Playfair Display', serif";
          ctx.fillStyle = "#ffffff";
          ctx.textAlign = "center";
          ctx.fillText("Usa tu llave de Bancolombia:", canvas.width/2, llaveY);

          // Caja para la llave
          const llaveBoxWidth = 800;
          const llaveBoxHeight = 110;
          const llaveBoxX = (canvas.width - llaveBoxWidth) / 2;
          const llaveBoxY = llaveY + 20;
          ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
          ctx.beginPath();
          ctx.roundRect(llaveBoxX, llaveBoxY, llaveBoxWidth, llaveBoxHeight, 15);
          ctx.fill();

          // Número de llave (centrado en la caja)
          ctx.font = "700 75px 'Playfair Display', serif";
          ctx.fillStyle = "#ffffff";
          ctx.fillText("0091983331", canvas.width/2, llaveBoxY + 75);

          const dataUrl = canvas.toDataURL("image/jpeg", 0.95);
          const preview = document.getElementById("preview");
          preview.src = dataUrl;
          preview.style.display = "block";
          
          const btn = document.getElementById("btn-descargar");
          btn.href = dataUrl;
          btn.style.display = "block";
        };
      };
    }
  </script>
</body>
</html>
