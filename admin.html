<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      gap: 16px;
    }
    h1 { color: #c8960c; font-size: 26px; font-weight: 400; }
    #total-pedido { font-size: 20px; color: #fff; }
    canvas { display: none; }
    #preview {
      max-width: 90vw;
      max-height: 70vh;
      border: 1px solid #c8960c;
      border-radius: 8px;
      display: none;
    }
    #btn-descargar {
      background: linear-gradient(135deg, #c8960c, #f5d060, #b8860b);
      color: #000;
      font-weight: bold;
      font-size: 18px;
      padding: 12px 32px;
      border-radius: 8px;
      text-decoration: none;
      display: none;
    }
  </style>
</head>
<body>

  <h1>KP Admin</h1>
  <div id="total-pedido">Cargando...</div>
  <a id="btn-descargar" download="recordatorio_kp.jpg">⬇️ Descargar imagen</a>
  <img id="preview">
  <canvas id="canvas"></canvas>

  <script>
    function obtenerFechaFinMes() {
      const hoy = new Date();
      const ultimoDia = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0).getDate();
      const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
      return `${ultimoDia} De ${meses[hoy.getMonth()]}`;
    }

    function drawMixedText(ctx, text, x, y, size) {
      ctx.save();
      ctx.textAlign = "center";
      ctx.fillStyle = "#ffffff";
      const chars = text.split('');
      const widths = chars.map(ch => {
        const isNum = /[0-9]/.test(ch);
        // Quitamos 'bold' para que sea letra normal
        ctx.font = `400 ${size}px ${isNum ? 'Arial' : "'Playfair Display', serif"}`;
        return ctx.measureText(ch).width;
      });
      let totalWidth = widths.reduce((a, b) => a + b, 0);
      let curX = x - totalWidth / 2;
      chars.forEach((ch, i) => {
        const isNum = /[0-9]/.test(ch);
        ctx.font = `400 ${size}px ${isNum ? 'Arial' : "'Playfair Display', serif"}`;
        ctx.fillText(ch, curX + widths[i] / 2, y);
        curX += widths[i];
      });
      ctx.restore();
    }

    const total = localStorage.getItem("kp_ultimo_total") || "0";
    const precioTexto = "$" + parseInt(total).toLocaleString('es-CO');
    const fecha = obtenerFechaFinMes();
    document.getElementById("total-pedido").textContent = "Total: " + precioTexto;

    document.fonts.ready.then(function () {
      const fondo = new Image();
      const qr = new Image();
      fondo.crossOrigin = "anonymous";
      qr.crossOrigin = "anonymous";

      // Tus archivos en GitHub
      fondo.src = "https://kaleth77.github.io/kpreloj/img/recordatorio.JPEG";
      qr.src = "https://kaleth77.github.io/kpreloj/img/Qr-llave.jpg";

      fondo.onload = function () {
        qr.onload = function () {
          const canvas = document.getElementById("canvas");
          const ctx = canvas.getContext("2d");
          canvas.width = fondo.width;
          canvas.height = fondo.height;

          // Dibujar el fondo con la marca de agua
          ctx.drawImage(fondo, 0, 0);

          // Escribir solo el total (ajustado al hueco de tu imagen)
          drawMixedText(ctx, precioTexto, canvas.width/2, 335, 110);

          // Escribir solo la fecha (ajustado al hueco inferior)
          drawMixedText(ctx, fecha, canvas.width/2, 1155, 95);

          // Dibujar el QR centrado abajo
          const qrW = 700; // Ancho del QR
          const qrH = (qr.height * qrW) / qr.width;
          ctx.drawImage(qr, (canvas.width - qrW)/2, 1260, qrW, qrH);

          // Generar vista previa
          const dataUrl = canvas.toDataURL("image/jpeg", 0.95);
          const preview = document.getElementById("preview");
          preview.src = dataUrl;
          preview.style.display = "block";

          const btn = document.getElementById("btn-descargar");
          btn.href = dataUrl;
          btn.style.display = "inline-block";
        };
      };
    });
  </script>

</body>
</html>
