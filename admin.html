<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      gap: 16px;
    }
    h1 { color: #c8960c; font-size: 26px; }
    #total-pedido { font-size: 22px; color: #fff; }
    canvas { display: none; }
    #preview {
      max-width: 90vw;
      max-height: 62vh;
      border: 2px solid #c8960c;
      border-radius: 8px;
      display: none;
    }
    #btn-descargar {
      background: linear-gradient(135deg, #c8960c, #f5d060, #b8860b);
      color: #000;
      font-weight: bold;
      font-size: 18px;
      padding: 12px 32px;
      border-radius: 8px;
      text-decoration: none;
      display: none;
    }
    #sin-pedido { font-size: 18px; color: #aaa; text-align: center; display: none; }
  </style>
</head>
<body>

  <h1>KP Admin</h1>
  <div id="total-pedido"></div>
  <a id="btn-descargar" download="recordatorio_kp.jpg">⬇️ Descargar imagen</a>
  <img id="preview">
  <canvas id="canvas"></canvas>
  <div id="sin-pedido">No hay pedidos aún.<br>Espera a que un cliente compre.</div>

  <script>
    function obtenerFechaFinMes() {
      const hoy = new Date();
      const ultimoDia = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0).getDate();
      const meses = [
        "Enero","Febrero","Marzo","Abril","Mayo","Junio",
        "Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"
      ];
      return `${ultimoDia} De ${meses[hoy.getMonth()]}`;
    }

    const total = localStorage.getItem("kp_ultimo_total");

    if (!total) {
      document.getElementById("sin-pedido").style.display = "block";
    } else {
      const precioTexto = "$" + parseInt(total).toLocaleString('es-CO');
      const fecha = obtenerFechaFinMes();
      document.getElementById("total-pedido").textContent = "Último pedido: " + precioTexto;

      document.fonts.ready.then(function () {
        cargarImagen(precioTexto, fecha);
      });
    }

    function cargarImagen(precioTexto, fecha) {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = "https://kaleth77.github.io/kpreloj/img/recordatorio.JPG";

      img.onload = function () {
        const canvas = document.getElementById("canvas");
        const W = img.width;   // 1024
        const H = img.height;  // 1536
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext("2d");

        ctx.drawImage(img, 0, 0);
        ctx.textAlign = "center";
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "rgba(0,0,0,0.95)";
        ctx.shadowBlur = 20;
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;

        // ── TEXTO ARRIBA — más grande y centrado en el espacio disponible ──
        // Espacio arriba del KP: aprox y=0 a y=320
        ctx.font = "bold 100px 'Playfair Display', serif";
        ctx.fillText("Recordatorio", W / 2, 105);

        ctx.font = "400 76px 'Playfair Display', serif";
        ctx.fillText("Cantidad a pagar", W / 2, 205);

        ctx.font = "bold 88px 'Playfair Display', serif";
        ctx.fillText(precioTexto, W / 2, 305);

        // ── TEXTO ABAJO — más grande y centrado en el espacio disponible ──
        // Espacio abajo del KP: aprox y=1050 a y=1536
        ctx.font = "400 68px 'Playfair Display', serif";
        ctx.fillText("Plazo para cancelar tu", W / 2, 1100);
        ctx.fillText("producto", W / 2, 1180);

        ctx.font = "400 80px 'Playfair Display', serif";
        ctx.fillText(fecha, W / 2, 1275);

        ctx.font = "400 64px 'Playfair Display', serif";
        ctx.fillText("Métodos de pago", W / 2, 1360);
        ctx.fillText("-Efectivo", W / 2, 1435);
        ctx.fillText("-Nequi 3008734383", W / 2, 1510);

        ctx.shadowColor = "transparent";

        const dataUrl = canvas.toDataURL("image/jpeg", 0.95);
        const preview = document.getElementById("preview");
        preview.src = dataUrl;
        preview.style.display = "block";

        const btn = document.getElementById("btn-descargar");
        btn.href = dataUrl;
        btn.style.display = "block";
      };

      img.onerror = function () {
        alert("No se pudo cargar la imagen. Verifica que recordatorio.JPG esté en la carpeta img de GitHub.");
      };
    }
  </script>

</body>
</html>
