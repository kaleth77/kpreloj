<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KP Admin - Generador de Recordatorio</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      gap: 16px;
    }
    h1 { color: #c8960c; font-size: 26px; font-weight: 400; }
    #total-pedido { font-size: 20px; color: #fff; margin-bottom: 10px; }
    canvas { display: none; }
    #preview {
      max-width: 90vw;
      max-height: 75vh;
      border: 1px solid #c8960c;
      border-radius: 8px;
    }
    #btn-descargar {
      background: linear-gradient(135deg, #c8960c, #f5d060, #b8860b);
      color: #000;
      font-weight: bold;
      font-size: 18px;
      padding: 12px 32px;
      border-radius: 8px;
      text-decoration: none;
      display: none;
    }
    #sin-pedido { font-size: 18px; color: #aaa; text-align: center; display: none; }
  </style>
</head>
<body>

  <h1>KP Admin</h1>
  <div id="total-pedido"></div>
  <a id="btn-descargar" download="recordatorio_kp.jpg">⬇️ Descargar imagen</a>
  <img id="preview" style="display:none;">
  <canvas id="canvas"></canvas>
  <div id="sin-pedido">No hay pedidos registrados. Espera una compra.</div>

  <script>
    function obtenerFechaFinMes() {
      const hoy = new Date();
      const ultimoDia = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0).getDate();
      const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
      return `${ultimoDia} De ${meses[hoy.getMonth()]}`;
    }

    function drawMixedText(ctx, text, x, y, size) {
      ctx.save();
      ctx.textAlign = "center";
      ctx.fillStyle = "#ffffff";
      
      const chars = text.split('');
      const widths = chars.map(ch => {
        const isNum = /[0-9]/.test(ch);
        ctx.font = `400 ${size}px ${isNum ? 'Arial' : "'Playfair Display', serif"}`;
        return ctx.measureText(ch).width;
      });
      
      let totalWidth = widths.reduce((a, b) => a + b, 0);
      let curX = x - totalWidth / 2;

      chars.forEach((ch, i) => {
        const isNum = /[0-9]/.test(ch);
        ctx.font = `400 ${size}px ${isNum ? 'Arial' : "'Playfair Display', serif"}`;
        ctx.fillText(ch, curX + widths[i] / 2, y);
        curX += widths[i];
      });
      ctx.restore();
    }

    const total = localStorage.getItem("kp_ultimo_total");

    if (!total) {
      document.getElementById("sin-pedido").style.display = "block";
    } else {
      const precioTexto = "$" + parseInt(total).toLocaleString('es-CO');
      const fecha = obtenerFechaFinMes();
      document.getElementById("total-pedido").textContent = "Total: " + precioTexto;
      document.fonts.ready.then(() => cargarImagenes(precioTexto, fecha));
    }

    function cargarImagenes(precioTexto, fecha) {
      const fondo = new Image();
      const qr = new Image();
      const llave = new Image();
      fondo.crossOrigin = "anonymous";
      qr.crossOrigin = "anonymous";
      llave.crossOrigin = "anonymous";

      // URLs de tus archivos en GitHub
      fondo.src = "https://kaleth77.github.io/kpreloj/img/recordatorio.JPEG";
      qr.src = "https://kaleth77.github.io/kpreloj/img/qr.jpg";
      llave.src = "https://kaleth77.github.io/kpreloj/img/llave.jpg";

      fondo.onload = () => {
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = fondo.width;
        canvas.height = fondo.height;

        ctx.drawImage(fondo, 0, 0);

        // --- UBICACIÓN DE TEXTOS LIMPIOS ARRIBA ---
        drawMixedText(ctx, "Recordatorio:", canvas.width/2, 100, 80);
        drawMixedText(ctx, "Cantidad a pagar:", canvas.width/2, 200, 65);
        drawMixedText(ctx, precioTexto, canvas.width/2, 300, 110);

        // Añadir Marca de Agua KP
        ctx.font = "700 35px Arial, sans-serif";
        ctx.fillStyle = "rgba(200, 150, 12, 0.4)";
        ctx.textAlign = "center";
        ctx.fillText("KP - kpreloj", canvas.width/2, 380);

        // --- UBICACIÓN DEL QR EN EL CENTRO ---
        qr.onload = () => {
          const qrW = 750; // Ancho del QR
          const qrH = (qr.height * qrW) / qr.width;
          const qrX = (canvas.width - qrW)/2; // Centrado horizontal
          ctx.drawImage(qr, qrX, 450, qrW, qrH);

          // --- UBICACIÓN DE LA LLAVE ABAJO ---
          llave.onload = () => {
            const llaveW = 750; // Ancho de la Llave
            const llaveH = (llave.height * llaveW) / llave.width;
            const llaveX = (canvas.width - llaveW)/2; // Centrado horizontal
            const llaveY = 450 + qrH + 120; // Debajo del QR
            ctx.drawImage(llave, llaveX, llaveY, llaveW, llaveH);

            // 4. Textos de Fecha Limite al final (centrado, debajo de la llave)
            const fechaY = llaveY + llaveH + 80;
            drawMixedText(ctx, "Fecha límite de pago:", canvas.width/2, fechaY, 65);
            drawMixedText(ctx, fecha, canvas.width/2, fechaY + 100, 85);

            const dataUrl = canvas.toDataURL("image/jpeg", 0.95);
            const preview = document.getElementById("preview");
            preview.src = dataUrl;
            preview.style.display = "block";
            
            const btn = document.getElementById("btn-descargar");
            btn.href = dataUrl;
            btn.style.display = "block";
          };
        };
      };
    }
  </script>
</body>
</html>
